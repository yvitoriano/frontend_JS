```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nadadores - Nado Livre</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #f2f2f2;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        form {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .cadastrar {
            background-color: #0077b6;
            color: white;
        }

        .card {
            background-color: white;
            padding: 20px;
            margin-top: 15px;
            border-radius: 8px;
        }

        .acoes button {
            margin-right: 10px;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #0077b6;
        }

        .nao-bloqueado {
            color: green;
            font-weight: bold;
        }

        .bloqueado {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Nadadores</h1>

        <a class="voltar" href="index.html">
            ← Voltar para o início
        </a>


        <form id="formNadador">

            <label for="idNadador">
                ID do Nadador:
            </label>

            <input
                type="text"
                id="idNadador"
                required
            >


            <label for="nome">
                Nome:
            </label>

            <input
                type="text"
                id="nome"
                required
            >


            <label for="telefone">
                Telefone:
            </label>

            <input
                type="text"
                id="telefone"
                required
            >


            <label for="cpf">
                CPF:
            </label>

            <input
                type="text"
                id="cpf"
                required
            >


            <label for="email">
                E-mail:
            </label>

            <input
                type="email"
                id="email"
                required
            >


            <button
                type="submit"
                class="cadastrar"
                id="botaoFormulario"
            >
                Cadastrar
            </button>

        </form>


        <h2>Nadadores cadastrados</h2>

        <div id="listaNadadores"></div>

    </div>


    <script>

        class Nadador {

            constructor(
                id_nadador,
                nome,
                telefone,
                cpf,
                email
            ) {

                this.id_nadador =
                    id_nadador;

                this.nome =
                    nome;

                this.telefone =
                    telefone;

                this.cpf =
                    cpf;

                this.email =
                    email;

                this.status =
                    "Não bloqueado";

            }

        }


        const nadadores = [];

        let nadadorEditando = null;


        const formNadador =
            document.getElementById(
                "formNadador"
            );


        const listaNadadores =
            document.getElementById(
                "listaNadadores"
            );


        const campoId =
            document.getElementById(
                "idNadador"
            );


        const campoNome =
            document.getElementById(
                "nome"
            );


        const campoTelefone =
            document.getElementById(
                "telefone"
            );


        const campoCpf =
            document.getElementById(
                "cpf"
            );


        const campoEmail =
            document.getElementById(
                "email"
            );


        const botaoFormulario =
            document.getElementById(
                "botaoFormulario"
            );


        formNadador.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const idNadador =
                    campoId.value;

                const nome =
                    campoNome.value;

                const telefone =
                    campoTelefone.value;

                const cpf =
                    campoCpf.value;

                const email =
                    campoEmail.value;


                if (nadadorEditando === null) {

                    const nadador =
                        new Nadador(
                            idNadador,
                            nome,
                            telefone,
                            cpf,
                            email
                        );


                    nadadores.push(
                        nadador
                    );

                } else {

                    nadadorEditando.id_nadador =
                        idNadador;

                    nadadorEditando.nome =
                        nome;

                    nadadorEditando.telefone =
                        telefone;

                    nadadorEditando.cpf =
                        cpf;

                    nadadorEditando.email =
                        email;


                    nadadorEditando = null;

                    botaoFormulario.textContent =
                        "Cadastrar";

                }


                formNadador.reset();

                atualizarLista();

            }
        );


        function atualizarLista() {

            listaNadadores.innerHTML = "";


            for (
                const nadador
                of nadadores
            ) {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className = "card";


                const id =
                    document.createElement(
                        "p"
                    );

                id.textContent =
                    "ID: " +
                    nadador.id_nadador;


                const nome =
                    document.createElement(
                        "p"
                    );

                nome.textContent =
                    "Nome: " +
                    nadador.nome;


                const telefone =
                    document.createElement(
                        "p"
                    );

                telefone.textContent =
                    "Telefone: " +
                    nadador.telefone;


                const cpf =
                    document.createElement(
                        "p"
                    );

                cpf.textContent =
                    "CPF: " +
                    nadador.cpf;


                const email =
                    document.createElement(
                        "p"
                    );

                email.textContent =
                    "E-mail: " +
                    nadador.email;


                const status =
                    document.createElement(
                        "p"
                    );

                status.textContent =
                    "Status: " +
                    nadador.status;


                if (
                    nadador.status ===
                    "Não bloqueado"
                ) {

                    status.className =
                        "nao-bloqueado";

                } else {

                    status.className =
                        "bloqueado";

                }


                const botaoEditar =
                    document.createElement(
                        "button"
                    );


                botaoEditar.textContent =
                    "Editar";


                botaoEditar.addEventListener(
                    "click",
                    function() {

                        campoId.value =
                            nadador.id_nadador;

                        campoNome.value =
                            nadador.nome;

                        campoTelefone.value =
                            nadador.telefone;

                        campoCpf.value =
                            nadador.cpf;

                        campoEmail.value =
                            nadador.email;


                        nadadorEditando =
                            nadador;


                        botaoFormulario.textContent =
                            "Alterar";

                    }
                );


                const botaoStatus =
                    document.createElement(
                        "button"
                    );


                if (
                    nadador.status ===
                    "Não bloqueado"
                ) {

                    botaoStatus.textContent =
                        "Bloquear";

                } else {

                    botaoStatus.textContent =
                        "Desbloquear";

                }


                botaoStatus.addEventListener(
                    "click",
                    function() {

                        if (
                            nadador.status ===
                            "Não bloqueado"
                        ) {

                            nadador.status =
                                "Bloqueado";

                        } else {

                            nadador.status =
                                "Não bloqueado";

                        }


                        atualizarLista();

                    }
                );


                const acoes =
                    document.createElement(
                        "div"
                    );


                acoes.className =
                    "acoes";


                acoes.appendChild(
                    botaoEditar
                );

                acoes.appendChild(
                    botaoStatus
                );


                card.appendChild(id);

                card.appendChild(nome);

                card.appendChild(telefone);

                card.appendChild(cpf);

                card.appendChild(email);

                card.appendChild(status);

                card.appendChild(acoes);


                listaNadadores.appendChild(
                    card
                );

            }

        }

    </script>

</body>

</html>
